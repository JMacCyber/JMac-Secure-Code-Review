[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jscr"
version = "0.1.0"
description = "JMac Secure Code Review (JSCR): a security-first AI code review engine. Deny by default, deterministic policy, no silent egress."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "JMac Cyber" }]
keywords = ["security", "code-review", "sast", "sarif", "ai", "appsec"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

# No runtime dependencies, and this is a security property rather than an
# accident. Every dependency is code that runs with the tool's privileges on
# a machine holding source that has not been reviewed yet. JSCR is stdlib
# only. External scanners are separate programs, invoked by name, off by
# default, and never imported.
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/JMacCyber/JMac-Secure-Code-Review"
Source = "https://github.com/JMacCyber/JMac-Secure-Code-Review"
Issues = "https://github.com/JMacCyber/JMac-Secure-Code-Review/issues"
Security = "https://github.com/JMacCyber/JMac-Secure-Code-Review/blob/main/SECURITY.md"

[project.scripts]
jscr = "jscr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jscr.scanners" = ["rules/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "I", "UP", "C4"]
# UP004/UP030/UP032/UP037 would rewrite every ``.format()`` call and every
# ``class X(object)`` in the project. The style here is deliberately
# conservative — this package supports Python 3.9 and is meant to be read
# straight through by someone auditing it — and mechanically rewriting
# several hundred call sites in a security tool to gain nothing but style
# is a bad trade. Correctness rules stay on.
ignore = [
    "S101",
    "UP004",
    "UP006",
    "UP030",
    "UP032",
    "UP035",
    "UP037",
    "UP045",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.9"
files = ["src/jscr"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/jscr"]
# The tests run the CLI in-process, so the branch the operator takes is the
# branch measured. Nothing here is excluded: a line skipped by the report is
# a line nobody has to justify.

[tool.coverage.report]
show_missing = true
skip_covered = false
